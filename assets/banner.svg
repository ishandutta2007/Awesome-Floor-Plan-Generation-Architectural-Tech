<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4"/>
    </pattern>

    <!-- Blur Filter for Orbs -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <style>
    /* Dynamic background glow animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(0.9) translate(-30px, 20px); opacity: 0.6; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blueprintDash {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 1000px 300px; }
    .blueprint-line { stroke-dasharray: 8, 4; animation: blueprintDash 35s linear infinite; }
    .pill-box { animation: floatPill 5s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #94a3b8; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g filter="url(#blur-glow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" />
    <circle class="orb-2" cx="980" cy="260" r="160" fill="#818cf8" />
    <circle cx="600" cy="380" r="120" fill="#c084fc" opacity="0.25" />
  </g>

  <!-- Architectural CAD Blueprint Grid Overlay -->
  <rect width="1200" height="400" fill="url(#arch-grid)" />

  <!-- Subtle Blueprint Architectural Layout Background Lines -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <!-- Outer Walls Schematic -->
    <rect x="780" y="60" width="340" height="260" rx="4" class="blueprint-line" />
    <line x1="780" y1="160" x2="1020" y2="160" />
    <line x1="920" y1="160" x2="920" y2="320" />
    <line x1="1020" y1="60" x2="1020" y2="220" />
    <!-- Door Swing Arc -->
    <path d="M 880,160 A 40,40 0 0,1 920,200" stroke="#818cf8" stroke-dasharray="3,3" />
    <path d="M 780,120 A 40,40 0 0,1 820,160" stroke="#818cf8" stroke-dasharray="3,3" />
    <!-- Dimension Markers -->
    <line x1="780" y1="45" x2="1120" y2="45" stroke="#94a3b8" stroke-width="1" />
    <path d="M 780,40 L 780,50 M 1120,40 L 1120,50" stroke="#94a3b8" stroke-width="1" />
    <text x="930" y="42" class="code-text" text-anchor="middle" font-size="11">12.80 m</text>
  </g>

  <!-- Foreground Content: Clean, High-Contrast Typography & Pills -->
  <g id="foreground">
    <!-- Category Tag / Top Badge -->
    <g class="pill-box" transform="translate(80, 72)">
      <rect width="360" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.05em">🏛️ ARCHITECTURAL TECH &amp; BIM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="165" class="title-text" font-size="44" fill="#ffffff">
      Floor Plan Generation
    </text>
    <text x="80" y="215" class="title-text" font-size="44" fill="url(#primary-grad)">
      &amp; Architectural Tech
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="80" y="260" class="subtitle-text" font-size="17" fill="#94a3b8">
      Curated Generative AI Synthesis • 2D CAD Drafting • Parametric 3D BIM Modeling • Photorealistic Cloud Rendering
    </text>

    <!-- Feature Tags / Tech Stack Pills -->
    <g transform="translate(80, 298)">
      <!-- Pill 1: Generative AI -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="20" class="subtitle-text" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ GenAI Synthesis</text>
      </g>
      <!-- Pill 2: 2D/3D CAD -->
      <g transform="translate(142, 0)">
        <rect width="115" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="57" y="20" class="subtitle-text" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">📐 2D/3D CAD</text>
      </g>
      <!-- Pill 3: Open BIM / IFC -->
      <g transform="translate(269, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="20" class="subtitle-text" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🏢 Open-BIM (IFC)</text>
      </g>
      <!-- Pill 4: Cloud Raytracing -->
      <g transform="translate(411, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="20" class="subtitle-text" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">✨ Cloud Ray-tracing</text>
      </g>
      <!-- Pill 5: Commercial & OSS -->
      <g transform="translate(568, 0)">
        <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="20" class="subtitle-text" font-size="12" font-weight="600" fill="#f472b6" text-anchor="middle">🚀 SaaS &amp; Open Source</text>
      </g>
    </g>
  </g>
</svg>
